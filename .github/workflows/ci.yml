name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --ci
      - run: npm run test:e2e -- --ci

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test -- --ci

  docker-build:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tag-backend ./backend
      - run: docker build -t tag-frontend ./frontend
      # docker build valide seulement que l'image se construit — pas qu'elle
      # démarre. Un run réel a déjà révélé un bug (dist/main.js absent du
      # chemin attendu sur un build sans cache incrémental) que le build seul
      # ne détectait pas.
      - name: Démarrer le conteneur tag-backend (smoke test)
        run: docker run -d --name tag-backend-smoke -p 3050:3000 -e JWT_SECRET=ci-smoke-secret -e DB_DRIVER=sqljs tag-backend
      - name: Attendre que /api/v1/health réponde
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3050/api/v1/health; then
              echo "backend en bonne santé"
              exit 0
            fi
            sleep 2
          done
          echo "backend indisponible après 60s"
          exit 1
      - name: Logs du conteneur tag-backend
        if: always()
        run: docker logs tag-backend-smoke
      - name: Arrêter le conteneur tag-backend
        if: always()
        run: docker rm -f tag-backend-smoke
